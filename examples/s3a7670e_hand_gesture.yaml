# =============================================================================
#  ESP32-S3-A7670E + vision (Hand Gesture classification, MobileNetV2 0.5)
#  Recognizes hand gestures (e.g. fist, palm, thumb_up, ok_sign, ...).
#
#  Place mobilenetv2_0_5_128_128_gesture.espdl next to this YAML.
#
#  Note: this model is a pure classifier - it expects a pre-cropped hand
#  image. For full-frame use, pair with hand_detect to crop first, then run
#  this on the crop (not yet supported in this single-model pipeline).
# =============================================================================
substitutions:
  name: s3a7670e_hand_gesture
  device_description: "4G camera ESPhome - Hand gesture recognition"
  resolution: '320x240'
  model_name: mobilenetv2_0_5_128_128_gesture.espdl
  model_family: hand_gesture_recognition
  score_threshold: '0.50'
  topk: '1'
  income_topic: "mqtt-cloud-synchronizer"

esphome:
  name: ${name}
  min_version: 2026.1.0

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240Mhz
  flash_size: 16MB
  partitions: partitions_custom_16mb.csv
  framework:
    type: esp-idf
    version: dev
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_ESP32_DEFAULT_CPU_FREQ_240: y
      CONFIG_UART_ISR_IN_IRAM: y
      ESP_MODEM_CMUX_DEFRAGMENT_PAYLOAD: n
      ESP_MODEM_USE_INFLATABLE_BUFFER_IF_NEEDED: y
      ESP_MODEM_CMUX_USE_SHORT_PAYLOADS_ONLY: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_PARTITION_TABLE_CUSTOM: "y"
      CONFIG_PARTITION_TABLE_CUSTOM_FILENAME: "partitions_custom_16mb.csv"
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"

logger:
  hardware_uart: UART0
  level: verbose

external_components:
  - source: github://pr#6721
    components: [network, modem]
    refresh: 10s
  - source: github://jesserockz/esphome-components@1b449c22e749933d11ca57c77d8303f851a817e1
    components: [file]
    refresh: 10s
  - source:
      type: git
      url: https://github.com/youkorr/s3_vision
      ref: main
    components: [vision]
    refresh: 0s

mqtt:
  broker: !secret cloud_mqtt_address
  port: 8883
  username: !secret cloud_mqtt_user
  password: !secret cloud_mqtt_password
  client_id: ${name}
  certificate_authority: !secret cloud_certificate

psram:
  mode: octal
  speed: '80Mhz'

i2c:
  - id: my_i2c
    sda: GPIO15
    scl: GPIO16

file:
  - id: my_model
    path: ./${model_name}

esp32_camera:
  name: ${name}_camera
  id: my_camera
  external_clock:
    pin: GPIO39
    frequency: 20MHz
  i2c_id: my_i2c
  data_pins: [GPIO07, GPIO08, GPIO09, GPIO10, GPIO11, GPIO12, GPIO13, GPIO14]
  vsync_pin: GPIO42
  href_pin: GPIO41
  pixel_clock_pin: GPIO46
  resolution: ${resolution}
  pixel_format: rgb565
  frame_buffer_count: 1
  frame_buffer_location: 'PSRAM'

vision:
  id: my_vision
  esp32_camera_id: my_camera
  model_id: my_model
  model_family: ${model_family}

  score_threshold: ${score_threshold}
  topk: ${topk}
  detection_interval_ms: 300
  frame_width: 320
  frame_height: 240

  on_classification:
    - then:
        - logger.log:
            format: "Gesture: %s (%.2f)"
            args: ["label.c_str()", "score"]
        - if:
            condition:
              modem.connected:
            then:
              - mqtt.publish:
                  topic: device/${name}/gesture/state
                  payload: !lambda |-
                    char buf[160];
                    snprintf(buf, sizeof(buf),
                      "{\"gesture\":\"%s\",\"score\":%.3f}",
                      label.c_str(), score);
                    return std::string(buf);

modem:
  id: atmodem
  rx_pin:
    number: GPIO17
  tx_pin:
    number: GPIO18
  model: SIM7670
  apn: free
  pin_code: !secret sim_pin
