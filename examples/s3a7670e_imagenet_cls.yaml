# =============================================================================
#  ESP32-S3-A7670E + vision (ImageNet classification, MobileNetV2)
#  1000-class ImageNet classifier. Outputs label + score (no bounding boxes).
#
#  Place imagenet_cls_mobilenetv2_s8_v1.espdl next to this YAML.
#
#  This is a CLASSIFICATION family - it uses `on_classification:` trigger,
#  NOT `on_object_detected:`. `on_detection_image:` does NOT fire (no boxes).
# =============================================================================
substitutions:
  name: s3a7670e_imagenet_cls
  device_description: "4G camera ESPhome - ImageNet classification"
  resolution: '320x240'
  model_name: imagenet_cls_mobilenetv2_s8_v1.espdl
  model_family: classify
  score_threshold: '0.40'   # softmax probabilities, raise to filter noise
  topk: '1'                 # report only the top-1 class
  income_topic: "mqtt-cloud-synchronizer"
  md5_url: "https://raw.githubusercontent.com/SeByDocKy/myESPhome/main/firmwares/esp32_S3_A7670E/firmware.md5"
  bin_url: "https://raw.githubusercontent.com/SeByDocKy/myESPhome/main/firmwares/esp32_S3_A7670E/firmware.ota.bin"

esphome:
  name: ${name}
  min_version: 2026.1.0
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              modem.connected:
            then:
              - mqtt.publish:
                  topic: device/${name}/camera/config
                  retain: true
                  payload: |-
                    {"component": "image", "name": "ESP32 Camera Picture", "unique_id": "${name}_camera", "content_type": "image/jpeg", "image_encoding": "b64", "encoding": "image_encoding", "icon": "mdi:image", "device": {
                    "identifiers": ["${name}"], "name": "${name}", "manufacturer": "Espressif", "model": "ESP32-S3", "sw_version": "1.0.0"}}
              - mqtt.publish:
                  topic: device/${name}/camera_event/config
                  retain: true
                  payload: |-
                    {"component":"sensor","name":"ESP32 Vision","unique_id":"${name}_vision_event","state_topic":"device/${name}/camera_event/state","value_template":"{{ value_json.type }} ({{ value_json.count | default(0) }})","json_attributes_topic":"device/${name}/camera_event/state","json_attributes_template":"{{ value }}","icon":"mdi:eye","device":{"identifiers":["${name}"],"name":"${name}","manufacturer":"Smartphoton","model":"ESP32-S3-Vision","sw_version":"1.0.4"}}

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240Mhz
  flash_size: 16MB
  partitions: partitions_custom_16mb.csv
  framework:
    type: esp-idf
    version: dev
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_ESP32_DEFAULT_CPU_FREQ_240: y
      CONFIG_UART_ISR_IN_IRAM: y
      ESP_MODEM_CMUX_DEFRAGMENT_PAYLOAD: n
      ESP_MODEM_USE_INFLATABLE_BUFFER_IF_NEEDED: y
      ESP_MODEM_CMUX_USE_SHORT_PAYLOADS_ONLY: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_PARTITION_TABLE_CUSTOM: "y"
      CONFIG_PARTITION_TABLE_CUSTOM_FILENAME: "partitions_custom_16mb.csv"
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"

logger:
  hardware_uart: UART0
  level: verbose

ota:
  - platform: http_request

http_request:
  verify_ssl: false

external_components:
  - source: github://pr#6721
    components: [network, modem]
    refresh: 10s
  - source: github://jesserockz/esphome-components@1b449c22e749933d11ca57c77d8303f851a817e1
    components: [file]
    refresh: 10s
  - source: github://pr#13585
    components: [max17048]
    refresh: 10s
  - source:
      type: git
      url: https://github.com/youkorr/s3_vision
      ref: main
    components: [vision]
    refresh: 0s

mqtt:
  broker: !secret cloud_mqtt_address
  port: 8883
  username: !secret cloud_mqtt_user
  password: !secret cloud_mqtt_password
  client_id: ${name}
  certificate_authority: !secret cloud_certificate

psram:
  mode: octal
  speed: '80Mhz'

i2c:
  - id: my_i2c
    sda: GPIO15
    scl: GPIO16

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO38
    num_leds: 1
    chipset: ws2812
    name: ${name}_led
    id: led

file:
  - id: my_model
    path: ./${model_name}

esp32_camera:
  name: ${name}_camera
  id: my_camera
  external_clock:
    pin: GPIO39
    frequency: 20MHz
  i2c_id: my_i2c
  data_pins: [GPIO07, GPIO08, GPIO09, GPIO10, GPIO11, GPIO12, GPIO13, GPIO14]
  vsync_pin: GPIO42
  href_pin: GPIO41
  pixel_clock_pin: GPIO46
  resolution: ${resolution}
  pixel_format: rgb565
  frame_buffer_count: 1
  frame_buffer_location: 'PSRAM'

vision:
  id: my_vision
  esp32_camera_id: my_camera
  model_id: my_model
  model_family: ${model_family}

  score_threshold: ${score_threshold}
  topk: ${topk}
  detection_interval_ms: 500
  inference_task_stack_size: 8192
  inference_task_priority: 5
  frame_width: 320
  frame_height: 240

  on_classification:
    - then:
        - logger.log:
            format: "Classification: %s (%.2f)"
            args: ["label.c_str()", "score"]
        - if:
            condition:
              modem.connected:
            then:
              - mqtt.publish:
                  topic: device/${name}/camera_event/state
                  payload: !lambda |-
                    return id(my_vision).get_inference_json();

modem:
  id: atmodem
  rx_pin:
    number: GPIO17
  tx_pin:
    number: GPIO18
  model: SIM7670
  apn: free
  pin_code: !secret sim_pin
